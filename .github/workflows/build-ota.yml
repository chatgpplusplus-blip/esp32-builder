name: Build ESP32 OTA firmware

on:
  workflow_dispatch:
    inputs:
      code_b64:
        description: "Contenido de user_app.cpp en Base64"
        required: true
      ssid:
        description: "WiFi SSID"
        required: true
      pass:
        description: "WiFi password"
        required: true

jobs:
  build: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: latest

      - name: Setup ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Descargar PubSubClient y copiarlo a sketch
        run: |
          mkdir -p lib
          git clone https://github.com/knolleary/pubsubclient.git lib/PubSubClient
          mkdir -p sketch
          cp lib/PubSubClient/src/PubSubClient.* sketch/
          echo "Contenido de sketch tras copiar PubSubClient:"
          ls -R sketch

      - name: Inyectar WiFi y user_app.cpp
        env:
          WIFI_SSID: ${{ github.event.inputs.ssid }}
          WIFI_PASS: ${{ github.event.inputs.pass }}
          CODE_B64: ${{ github.event.inputs.code_b64 }}
        run: |
          mkdir -p sketch

          # Crear config_wifi.h con las credenciales WiFi
          echo '#pragma once' > sketch/config_wifi.h
          echo '#define WIFI_SSID "'$WIFI_SSID'"' >> sketch/config_wifi.h
          echo '#define WIFI_PASS "'$WIFI_PASS'"' >> sketch/config_wifi.h

          # Crear user_app.cpp desde base64
          echo "$CODE_B64" | base64 -d > sketch/user_app.cpp

          echo "Archivos en sketch después de inyectar user_app:"
          ls -R sketch

      - name: Compilar sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32da sketch

      - name: Preparar firmware como archivo de salida
        run: |
          BIN_PATH=$(find . -path "*sketch.ino.bin" -o -path "*sketch.bin" | head -n 1)
          echo "BIN_PATH=$BIN_PATH"
          if [ -z "$BIN_PATH" ]; then
            echo "No se encontró firmware .bin"
            exit 1
          fi
          mkdir -p out
          cp "$BIN_PATH" out/firmware.bin

      - name: Subir firmware como artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/firmware.bin
