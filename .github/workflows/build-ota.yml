name: build
run-name: ota build ${{ inputs.trace_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      trace_id:
        description: "id desde la web/app"
        required: false
        default: ""
      wifi_ssid:
        required: true
      wifi_pass:
        required: true
      mqtt_host:
        required: true
      mqtt_user:
        required: true
      mqtt_pass:
        required: true
      user_app_b64:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ESP32_CORE_VERSION: "3.3.6"
      ARDUINO_CLI_VERSION: "1.4.1"
      # Forzamos XDG para que el build cache vaya a un path estable
      XDG_CACHE_HOME: /home/runner/.cache

    steps:
      - name: Checkout (más rápido)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          # Ajusta esto a tu repo: incluye solo lo necesario
          sparse-checkout: |
            sketch
            .github/workflows

      # Cache SOLO del core ESP32 (tools + hardware)
      - name: Cache ESP32 core/tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages/esp32
            ~/.arduino15/staging
            ~/.arduino15/package*_index.json*
          key: ${{ runner.os }}-esp32core-${{ env.ESP32_CORE_VERSION }}-cli-${{ env.ARDUINO_CLI_VERSION }}-v3

      # Cache del build cache incremental (lo que te baja el tiempo de compile en runs siguientes)
      - name: Cache Arduino build cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/arduino
          key: ${{ runner.os }}-arduinobuildcache-${{ env.ESP32_CORE_VERSION }}-cli-${{ env.ARDUINO_CLI_VERSION }}-v3

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure Arduino build cache path (IMPORTANTE)
        shell: bash
        run: |
          set -e
          arduino-cli config init --overwrite
          # En CLI moderno, el build cache se define por config (no por --build-cache-path)
          arduino-cli config set build_cache.path "/home/runner/.cache/arduino"
          echo "build_cache.path=$(arduino-cli config get build_cache.path)"

      - name: Install ESP32 core (si falta)
        shell: bash
        run: |
          set -e
          arduino-cli core update-index
          if ! arduino-cli core list | grep -q "esp32:esp32.*${ESP32_CORE_VERSION}"; then
            arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"
          fi
          echo "ESP32 core ${ESP32_CORE_VERSION} OK ✅"

      # (Opcional) recorta cosas no usadas para bajar el tamaño del cache (solo si tu FQBN es Xtensa)
      # Úsalo si quieres intentar bajar segundos del restore del cache.
      - name: (Optional) Strip unused tools to reduce cache
        shell: bash
        run: |
          set -e
          # OJO: si un día compilas un target RISC-V (C3/C6/H2), esto te rompería.
          rm -rf ~/.arduino15/packages/esp32/tools/riscv32-esp-elf-gcc || true
          rm -rf ~/.arduino15/packages/esp32/tools/riscv32-esp-elf-gdb || true
          # Debug tools que normalmente no usas en CI:
          rm -rf ~/.arduino15/packages/esp32/tools/openocd-esp32 || true

      - name: Write sketch inputs
        shell: bash
        run: |
          set -e
          mkdir -p sketch
          cat > sketch/config_wifi.h <<'EOF'
          #pragma once
          #define WIFI_SSID "${{ inputs.wifi_ssid }}"
          #define WIFI_PASS "${{ inputs.wifi_pass }}"
          #define MQTT_HOST "${{ inputs.mqtt_host }}"
          #define MQTT_USER "${{ inputs.mqtt_user }}"
          #define MQTT_PASS "${{ inputs.mqtt_pass }}"
          EOF

          echo "${{ inputs.user_app_b64 }}" | base64 -d > sketch/user_app.cpp

      - name: Compile (paralelo)
        shell: bash
        run: |
          set -e
          mkdir -p out builddir
          arduino-cli compile \
            -b esp32:esp32:esp32da \
            sketch \
            --output-dir out \
            --build-path builddir \
            --jobs 0

      - name: Rename firmware
        shell: bash
        run: |
          set -e
          # Ajusta el nombre si tu output cambia; este suele ser el .bin principal
          # En Arduino CLI a veces queda como sketch.ino.bin si hay un .ino.
          # Si tu proyecto genera otro nombre, lista out/ para confirmarlo.
          ls -la out
          # Busca el .bin más grande como "firmware"
          BIN="$(ls -S out/*.bin | head -n 1)"
          cp "$BIN" out/firmware.bin
          ls -la out/firmware.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/firmware.bin
