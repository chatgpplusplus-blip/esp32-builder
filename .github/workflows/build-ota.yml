name: Build ESP32 OTA firmware

on:
  workflow_dispatch:
    inputs:
      code_b64:
        description: "Contenido de user_app.cpp en Base64"
        required: true
      ssid:
        description: "WiFi SSID"
        required: true
      pass:
        description: "WiFi password"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARDUINO_CLI_VERSION: "0.35.3"
      ESP32_CORE_VERSION: "3.3.6"
      BUILD_CACHE_DIR: ".arduino-build-cache"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # FAST cache: SOLO lo instalado (más estable y rápido de restaurar)
      - name: Cache ESP32 packages
        id: cache_packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages
          key: ${{ runner.os }}-esp32core-${{ env.ESP32_CORE_VERSION }}-cli-${{ env.ARDUINO_CLI_VERSION }}-fast-v1

      # Cache chico: build-cache (core.a, etc.)
      - name: Cache build-cache
        id: cache_build
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_CACHE_DIR }}
          key: ${{ runner.os }}-esp32core-${{ env.ESP32_CORE_VERSION }}-buildcache-fast-v1

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Setup ESP32 core (repair if needed)
        shell: bash
        run: |
          set -e
          arduino-cli config init || true
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

          # check core
          if arduino-cli core list | grep -qE "esp32:esp32[[:space:]]+${ESP32_CORE_VERSION}"; then
            echo "ESP32 core ${ESP32_CORE_VERSION} OK ✅"
          else
            echo "Installing core..."
            arduino-cli core update-index
            arduino-cli core install esp32:esp32@${ESP32_CORE_VERSION}
          fi

          # repair esp32-libs if missing (tu error del bootloader)
          if ! find "$HOME/.arduino15/packages/esp32" -path "*esp32-libs*" -name "bootloader_qio_80m.elf" -print -quit | grep -q .; then
            echo "esp32-libs missing -> reinstall core tools"
            arduino-cli core install esp32:esp32@${ESP32_CORE_VERSION} --overwrite
          fi

      - name: Inyectar WiFi y user_app.cpp
        shell: bash
        env:
          WIFI_SSID: ${{ github.event.inputs.ssid }}
          WIFI_PASS: ${{ github.event.inputs.pass }}
          CODE_B64: ${{ github.event.inputs.code_b64 }}
        run: |
          set -e
          mkdir -p sketch
          cat > sketch/config_wifi.h <<EOF
          #pragma once
          #define WIFI_SSID "${WIFI_SSID}"
          #define WIFI_PASS "${WIFI_PASS}"
          EOF
          echo "$CODE_B64" | base64 -d > sketch/user_app.cpp

      - name: Normalizar user_app.cpp (setup/loop -> UserSetup/UserLoop)
        shell: bash
        run: |
          set -e
          if grep -qE '^[[:space:]]*void[[:space:]]+setup[[:space:]]*\(' sketch/user_app.cpp; then
            sed -i -E 's/^[[:space:]]*void[[:space:]]+setup[[:space:]]*\(/void UserSetup(/' sketch/user_app.cpp
          fi
          if grep -qE '^[[:space:]]*void[[:space:]]+loop[[:space:]]*\(' sketch/user_app.cpp; then
            sed -i -E 's/^[[:space:]]*void[[:space:]]+loop[[:space:]]*\(/void UserLoop(/' sketch/user_app.cpp
          fi
          grep -qE 'void[[:space:]]+UserSetup[[:space:]]*\(' sketch/user_app.cpp
          grep -qE 'void[[:space:]]+UserLoop[[:space:]]*\(' sketch/user_app.cpp

      - name: Compilar sketch (fast)
        shell: bash
        run: |
          set -e
          mkdir -p "${BUILD_CACHE_DIR}"
          BUILD_PATH="${RUNNER_TEMP}/arduino-build"
          mkdir -p "${BUILD_PATH}"

          arduino-cli compile --fqbn esp32:esp32:esp32da sketch \
            --output-dir build \
            --build-path "${BUILD_PATH}" \
            --build-cache-path "${BUILD_CACHE_DIR}"

          ls -la build

      - name: Preparar firmware
        shell: bash
        run: |
          set -e
          BIN_PATH=$(find build -maxdepth 1 -type f -name "*sketch.ino.bin" | head -n 1)
          test -n "$BIN_PATH"
          mkdir -p out
          cp "$BIN_PATH" out/firmware.bin
          ls -la out/firmware.bin

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/firmware.bin
