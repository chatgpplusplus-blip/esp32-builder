name: Build ESP32 firmware

on:
  # Cada vez que hagas push a main, compila
  push:
    branches: [ "main" ]
  # Y también puedes lanzarlo a mano desde la pestaña "Actions"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Descarga tu repo en el runner
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2) Instala Arduino CLI usando la acción oficial
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # 3) Configura Arduino CLI e instala el core ESP32
      - name: Setup ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      # 4) Compila tu sketch de prueba
      - name: Compile sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32da sketch

      # 5) Sube el .bin como artifact para descargarlo luego
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: sketch/build/esp32.esp32.esp32da/sketch.ino.bin
